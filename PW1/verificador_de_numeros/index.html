<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificador de Números</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Verifique se um Número é Par ou Ímpar</h1>
        <h3>Digite o número escolhido</h3>
        <div class="verificacao">
            <input type="number" id="numero" placeholder="EX.: 10">
            <button class="verificar" id="verificar">Verificar</button>
        </div>
        <div class="resultado">
            <p><b>O Número escolhido foi:</b></p>
            <div class="imparPar" id="imparPar">Ímpar ou Par</div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
