<!DOCTYPE html>
<html lang="">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cálculo de Idade</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Calcule a sua Idade</h1>
        <p>Ano atual: 2025</p>
        <h3 class="subtitulo" id="subtitulo">Digite o ano que você nasceu</h3>
        <div class="calculo">
            <input type="number" id="anoNascimento" placeholder="Ex.: 2000">
            <button class="calcular" id="calcular">Calcular</button>
        </div>
        <div class="resultado">
            <p><b>Resultado:</b></p>
            <div class="idadeResultado" id="idadeResultado"><p>Idade</p></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
